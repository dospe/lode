<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lodě – návrh UI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); background-image: var(--bg-image); -webkit-font-smoothing: antialiased; }
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.screen { width: 100%; max-width: 980px; display: flex; flex-direction: column; align-items: center; gap: var(--gap); }

/* ---------- top bar ---------- */
.topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; }
.side { display: flex; flex-direction: column; gap: 5px; min-width: 120px; }
.side.right { align-items: flex-end; }
.side .who { font-size: 11px; letter-spacing: 2.5px; font-weight: 700; color: var(--dim); text-transform: uppercase; }
.fleet { display: flex; gap: 6px; align-items: center; }
.fleet .sh { display: flex; gap: 1.5px; }
.fleet .sh i { width: 7px; height: 7px; border-radius: 1.5px; background: var(--ship); display: block; }
.fleet .sh.sunk i { background: var(--sunk); opacity: .9; }
.turn { font-weight: 800; letter-spacing: 3px; text-transform: uppercase; font-size: 15px; padding: 8px 18px; border-radius: var(--radius-s);
  background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.turn.theirs { background: var(--surface2); color: var(--dim); }
.tools { display: flex; gap: 6px; }
.tools button { width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; font-size: 14px; }

/* ---------- boards ---------- */
.boards { display: flex; gap: 36px; flex-wrap: wrap; justify-content: center; }
.bsec { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bsec h3 { font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--dim); font-weight: 700; }
.wrap { display: grid; grid-template-columns: var(--lbl) auto; grid-template-rows: var(--lbl) auto; }
.corner { }
.cols { display: grid; grid-template-columns: repeat(10, var(--cell)); gap: var(--gapc); }
.cols span, .rows span { font-size: 10px; color: var(--dim); font-weight: 600; display: flex; align-items: center; justify-content: center; }
.rows { display: grid; grid-template-rows: repeat(10, var(--cell)); gap: var(--gapc); }
.board { display: grid; grid-template-columns: repeat(10, var(--cell)); grid-template-rows: repeat(10, var(--cell));
  gap: var(--gapc); background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-b); overflow: hidden; }
.nolabels .corner, .nolabels .cols, .nolabels .rows { display: none; }
.nolabels .wrap { grid-template-columns: auto; grid-template-rows: auto; }
.c { position: relative; background: var(--cell-bg); display: flex; align-items: center; justify-content: center; }
.c .k { position: absolute; font-size: var(--code-size); font-weight: 600; color: var(--code); letter-spacing: .2px; pointer-events: none;
  font-family: var(--code-font); line-height: 1; }
.code-corner .c .k { right: 3px; bottom: 2px; }
.code-center .c .k { left: 0; right: 0; text-align: center; }
.code-tl .c .k { left: 3px; top: 2px; }
.c.ship { background: var(--ship); }
.c.miss { background: var(--miss-bg); }
.c.miss::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--miss); }
.c.hit { background: var(--hit); }
.c.hit::after { content: '✕'; color: var(--on-hit); font-size: 15px; font-weight: 900; }
.c.sunk { background: var(--sunk); background-image: var(--sunk-hatch); }
.c.sunk::after { content: '✕'; color: var(--on-sunk); font-size: 15px; font-weight: 900; }
.c.hover { background: var(--hover); outline: 2px solid var(--accent); outline-offset: -2px; }
.c.hover::after { content: '+'; color: var(--accent); font-size: 18px; font-weight: 700; }
.hide-code-marked .c.hit .k, .hide-code-marked .c.sunk .k, .hide-code-marked .c.miss .k { display: none; }
.dim-code-ship .c.ship .k { color: var(--code-on-ship); }

/* ---------- log ---------- */
.log { width: 100%; max-width: 820px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: 13px; color: var(--dim);
  padding: 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); }
.log b { color: var(--text); font-weight: 600; }
.log .h { color: var(--hit-text); }
.log .s { color: var(--sunk-text); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--dim); flex-wrap: wrap; justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; border: 1px solid var(--line); }

/* ---------- menu ---------- */
.menu { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.menu .logo { margin-bottom: 26px; text-align: center; }
.menu .logo svg { width: 64px; height: 64px; color: var(--accent); filter: var(--logo-glow); }
.menu h1 { font-size: 46px; letter-spacing: 12px; font-weight: 900; color: var(--title); margin-top: 10px; }
.menu .sub { font-size: 12px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }
.btn { width: 240px; padding: 14px 22px; border-radius: var(--radius-s); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 14px; border: 1px solid transparent; cursor: pointer; font-family: inherit; }
.btn.p { background: var(--accent); color: var(--on-accent); }
.btn.s { background: var(--surface2); color: var(--accent); border-color: var(--accent); }

/* =========================== THEME A – Námořní (tmavá) =========================== */
[data-theme="A"] {
  --font: Inter, 'Segoe UI', system-ui, sans-serif; --code-font: Inter, system-ui, sans-serif;
  --bg: #0a1628; --bg-image: radial-gradient(ellipse at 30% 20%, #0d2040 0%, #0a1628 60%);
  --surface: #0f2040; --surface2: #1a3055; --line: #1e4070; --text: #d0e8ff; --dim: #7f9bbd;
  --accent: #00d4ff; --on-accent: #001018; --title: #e8f6ff; --logo-glow: drop-shadow(0 0 18px rgba(0,212,255,.6));
  --cell-bg: #0f2040; --code: rgba(160,196,236,.36); --code-on-ship: rgba(255,255,255,.35); --code-size: 8.5px;
  --ship: #2a7040; --miss-bg: #16294a; --miss: #8fa7c4;
  --hit: #ff3b3b; --on-hit: #fff; --hit-text: #ff6b6b;
  --sunk: #4a0b18; --on-sunk: #ff9b9b; --sunk-text: #ff9b9b;
  --sunk-hatch: repeating-linear-gradient(135deg, rgba(255,120,120,.14) 0 3px, transparent 3px 7px);
  --hover: rgba(0,212,255,.18);
  --cell: 36px; --gapc: 1px; --lbl: 22px; --gap: 14px; --radius: 8px; --radius-s: 6px; --radius-b: 3px;
}
/* =========================== THEME B – Radar (terminál) =========================== */
[data-theme="B"] {
  --font: 'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace; --code-font: 'DejaVu Sans Mono', ui-monospace, monospace;
  --bg: #04100a; --bg-image: radial-gradient(circle at 50% 40%, #0a2416 0%, #04100a 65%);
  --surface: rgba(10,36,22,.55); --surface2: #0c2a18; --line: #16452c; --text: #b8f0cc; --dim: #4f9a6e;
  --accent: #35e07c; --on-accent: #03110a; --title: #c9ffe0; --logo-glow: drop-shadow(0 0 14px rgba(53,224,124,.6));
  --cell-bg: #061a10; --code: rgba(53,224,124,.30); --code-on-ship: rgba(0,0,0,.45); --code-size: 9px;
  --ship: #2fd37a; --miss-bg: #0a2416; --miss: #3f8a5e;
  --hit: #ffb020; --on-hit: #1a0e00; --hit-text: #ffb020;
  --sunk: #e0362e; --on-sunk: #2a0505; --sunk-text: #ff5a52;
  --sunk-hatch: repeating-linear-gradient(135deg, rgba(0,0,0,.22) 0 3px, transparent 3px 7px);
  --hover: rgba(53,224,124,.18);
  --cell: 36px; --gapc: 1px; --lbl: 22px; --gap: 14px; --radius: 4px; --radius-s: 3px; --radius-b: 2px;
}
[data-theme="B"] .turn { letter-spacing: 2px; }
[data-theme="B"] .turn::before { content: '▶ '; }
[data-theme="B"] .turn::after { content: '_'; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
[data-theme="B"] .board { box-shadow: 0 0 0 1px #0d2e1c, 0 0 24px rgba(53,224,124,.12) inset; }
[data-theme="B"] .c .k { text-transform: uppercase; }
[data-theme="B"] .log { font-size: 12.5px; }
[data-theme="B"] .log::before { content: '> '; color: var(--accent); }
/* =========================== THEME C – Papír (světlá) =========================== */
[data-theme="C"] {
  --font: Inter, 'Segoe UI', system-ui, sans-serif; --code-font: 'DejaVu Sans Mono', ui-monospace, monospace;
  --bg: #f4efe4; --bg-image: none;
  --surface: #fffdf7; --surface2: #ebe4d3; --line: #d9d0bb; --text: #2b2b2b; --dim: #857d6c;
  --accent: #1f3f73; --on-accent: #ffffff; --title: #1f3f73; --logo-glow: none;
  --cell-bg: #fffdf7; --code: rgba(90,80,60,.38); --code-on-ship: rgba(255,255,255,.55); --code-size: 8.5px;
  --ship: #3a5a8c; --miss-bg: #f0ebdd; --miss: #7c93b8;
  --hit: #e8503f; --on-hit: #fff; --hit-text: #c93b2b;
  --sunk: #26262a; --on-sunk: #ffffff; --sunk-text: #26262a;
  --sunk-hatch: repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 3px, transparent 3px 7px);
  --hover: #e6f0ff;
  --cell: 36px; --gapc: 1px; --lbl: 22px; --gap: 14px; --radius: 12px; --radius-s: 8px; --radius-b: 6px;
}
[data-theme="C"] .topbar, [data-theme="C"] .log { box-shadow: 0 1px 2px rgba(60,40,0,.06), 0 4px 14px rgba(60,40,0,.06); }
[data-theme="C"] .board { box-shadow: 0 2px 10px rgba(60,40,0,.08); }
[data-theme="C"] .turn { box-shadow: 0 2px 6px rgba(31,63,115,.3); }
[data-theme="C"] .turn.theirs { box-shadow: none; }

/* ---------- mobile ---------- */
@media (max-width: 600px) {
  .stage { padding: 10px; align-items: flex-start; }
  .screen { gap: 10px; }
  [data-theme] { --cell: 29px; --lbl: 18px; --code-size: 7.5px; }
  [data-theme="B"] { --cell: 34px; --code-size: 8px; }
  .boards { gap: 14px; }
  .topbar { padding: 8px 12px; display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: 'turn turn' 'l r'; row-gap: 8px; }
  .topbar .turn { grid-area: turn; justify-self: center; }
  .topbar .side { grid-area: l; min-width: 0; }
  .topbar .side.right { grid-area: r; }
  .turn { font-size: 12px; padding: 7px 12px; letter-spacing: 2px; }
  .tools { display: none; }
  .c.hit::after, .c.sunk::after { font-size: 13px; }
  .log { font-size: 12px; gap: 10px; padding: 7px 10px; }
  .menu h1 { font-size: 36px; letter-spacing: 8px; }
}
</style>
</head>
<body>
<div class="stage"><div class="screen" id="root"></div></div>
<script>
const q = new URLSearchParams(location.search);
const theme = q.get('v') || 'A';
const screen = q.get('screen') || 'game';
const opts = { A: 'code-corner dim-code-ship', B: 'nolabels code-center hide-code-marked dim-code-ship', C: 'code-tl dim-code-ship' }[theme];
document.documentElement.dataset.theme = theme;
document.body.className = opts;

const COLS = 'ABCDEFGHIJ';
const SHIPS = [[1,'Letadlová loď',5],[2,'Bitevní loď',4],[3,'Křižník',3],[4,'Ponorka',3],[5,'Torpédoborec',2]];

// scenario (row 0-9, col 0-9)
const my = Array.from({length:10},()=>Array(10).fill(''));
const put = (cells, cls) => cells.forEach(([r,c]) => my[r][c] = cls);
put([[1,1],[1,2],[1,3],[1,4],[1,5]], 'ship'); put([[1,1],[1,2]], 'hit');          // carrier, 2 hits
put([[4,7],[5,7],[6,7],[7,7]], 'ship');                                            // battleship
put([[8,2],[8,3],[8,4]], 'ship');                                                  // cruiser
put([[0,9],[1,9],[2,9]], 'ship'); put([[1,9]], 'hit');                             // submarine, 1 hit
put([[5,1],[5,2]], 'sunk');                                                        // destroyer SUNK
put([[0,0],[3,4],[9,6],[6,3],[8,8],[2,6]], 'miss');

const opp = Array.from({length:10},()=>Array(10).fill(''));
const po = (cells, cls) => cells.forEach(([r,c]) => opp[r][c] = cls);
po([[0,0],[1,2],[2,5],[4,7],[7,1],[8,4],[9,9],[4,3],[0,6],[6,8],[3,8]], 'miss');
po([[5,6],[6,6]], 'hit');                                                          // 2 hits, not sunk
po([[3,2],[3,3],[3,4]], 'sunk');                                                   // cruiser SUNK
po([[7,6]], 'hover');

function board(grid, title) {
  let cols = '', rows = '', cells = '';
  for (let c = 0; c < 10; c++) cols += `<span>${COLS[c]}</span>`;
  for (let r = 0; r < 10; r++) rows += `<span>${r+1}</span>`;
  for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++)
    cells += `<div class="c ${grid[r][c]}"><span class="k">${COLS[c]}${r+1}</span></div>`;
  return `<div class="bsec"><h3>${title}</h3><div class="wrap"><div class="corner"></div><div class="cols">${cols}</div><div class="rows">${rows}</div><div class="board">${cells}</div></div></div>`;
}
function fleet(sunkIds) {
  return `<div class="fleet">${SHIPS.map(([id,n,len]) => `<span class="sh ${sunkIds.includes(id)?'sunk':''}" title="${n}">${'<i></i>'.repeat(len)}</span>`).join('')}</div>`;
}
const anchor = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V21"/><path d="M5 13H2.5c0 4.5 4.3 8 9.5 8s9.5-3.5 9.5-8H19"/><path d="M8 11h8"/></svg>`;

if (screen === 'menu') {
  document.getElementById('root').innerHTML = `
    <div class="menu">
      <div class="logo">${anchor}<h1>LODĚ</h1><div class="sub">klasická námořní bitva</div></div>
      <button class="btn p">Proti počítači</button>
      <button class="btn s">Dva hráči</button>
    </div>`;
} else {
  document.getElementById('root').innerHTML = `
    <div class="topbar">
      <div class="side"><span class="who">Ty</span>${fleet([5])}</div>
      <div class="turn">Tvůj tah</div>
      <div class="side right"><span class="who">Soupeř</span>${fleet([3])}</div>
    </div>
    <div class="boards">${board(my, 'Tvoje flotila')}${board(opp, 'Nepřátelské vody')}</div>
    <div class="log"><span class="s">Potopil jsi křižník!</span><span class="h">Soupeř zasáhl B2</span><span>Minul jsi I7</span></div>
    <div class="legend">
      <span><i style="background:var(--ship)"></i>loď</span>
      <span><i style="background:var(--miss-bg);position:relative"></i>minuto</span>
      <span><i style="background:var(--hit)"></i>zásah</span>
      <span><i style="background:var(--sunk);background-image:var(--sunk-hatch)"></i>potopeno</span>
    </div>`;
}
</script>
</body>
</html>
